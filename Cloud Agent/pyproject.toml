[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screenmind-superagent"
version = "0.2.0"
description = "Event-driven OCR task engine and interactive card prototype"
requires-python = ">=3.12"
dependencies = ["fastapi==0.136.1", "uvicorn==0.46.0", "httpx==0.28.1", "pydantic==2.13.4"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["screenmind*"]

[tool.setuptools.package-data]
screenmind = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

