# Replace the server_name if deploying under another domain.
# Certbot adds the HTTPS listener and HTTP redirect after DNS is ready.
server {
    listen 80;
    server_name agent.qwertyuiopasdf.asia;
    client_max_body_size 4m;

    location /.well-known/acme-challenge/ {
        root /var/www/screenmind-acme;
    }

    location = / {
        return 302 /download;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
